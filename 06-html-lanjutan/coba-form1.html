<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Form Html</title>
  </head>
  <body>
    <h1>Contoh Elemen</h1>

    <form>
      <label for="nama">Nama :</label>
      <input type="text" name="nama" placeholder="Masukkan Nama" id="nama" />

      <br />
      <label for="password">Password :</label>
      <input type="password" name="password" id="password" />
      <br />

      <label for="email">Email :</label>
      <input type="email" name="email" id="email" />
      <br />

      <label for="angka">Angka :</label>
      <input type="number" name="number" id="angka" min="0" max="100" />
      <br />

      <label for="tanggal">Tanggal :</label>
      <input type="date" name="tanggal" id="tanggal" />
      <br />

      <label for="warna">Warna :</label>
      <input type="color" name="warna" id="warna" />
      <br />

      <button type="submit">Kirim</button>
    </form>
  </body>
</html>
